<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Find the Parney — a mini-game by Pranav Varshney">
    <title>Find Me - Pranav</title>

    <link rel="icon" type="image/x-icon" href="/src/favicon/favicon.ico">
    <link rel="apple-touch-icon" href="/src/favicon/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono&family=Crimson+Text:ital,wght@0,400;0,700;1,400&display=swap">
    <link rel="stylesheet" href="/src/css/find_me.css">
</head>
<body>
    <a href="/" class="back-link">← Home</a>

    <div class="ui-overlay">
        <div>Find the Parney</div>
        <div class="timer" id="timer" aria-live="polite">0.0s</div>
    </div>

    <div class="game-container">
        <canvas id="game-canvas" aria-label="Find the Parney game board"></canvas>
    </div>

    <div id="result-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="result-title">
        <h2 id="result-title"></h2>
        <p id="result-message"></p>
        <button id="restart-btn" type="button">Play Again</button>
        <br><br>
        <a href="/" style="color: #1a1a1a; font-family: 'IBM Plex Mono'; font-size: 0.8rem;">Return Home</a>
    </div>

    <script src="/src/js/find_me.js"></script>
</body>
</html>
