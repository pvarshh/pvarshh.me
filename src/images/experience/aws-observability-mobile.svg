<svg xmlns="http://www.w3.org/2000/svg" width="360" height="672" viewBox="0 0 360 672" role="img" aria-labelledby="title desc">
<title id="title">Mapping dependencies and monitoring model-serving health</title>
<desc id="desc">Endpoint dependency mapping and infrastructure health monitoring provide complementary inputs for on-call diagnosis. The Go CLI maps Bedrock endpoints to downstream AWS services.</desc>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; fill: #293327; }
.label { font-size: 11px; font-weight: 600; letter-spacing: 1.3px; fill: #687062; }
.title { font-size: 16px; font-weight: 600; }
.detail { font-size: 12px; fill: #687062; }
.mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; font-size: 12px; }
.accent { fill: #53634f; }
.white { fill: #fafaf5; }
.light { fill: #cbddd5; }
</style>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M1 1 L6 3.5 L1 6" fill="none" stroke="#a0aa99" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="green-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M1 1 L6 3.5 L1 6" fill="none" stroke="#53634f" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="360" height="672" fill="#fafaf5"/>
<rect x="54" y="24" width="288" height="220" rx="6" fill="#fafaf5" stroke="#d6d9ce" stroke-width="1.2"/>
<text x="72" y="50" class="label" text-anchor="start" style="font-size:10px">DEPENDENCY MAPPING</text>
<text x="198" y="86" class="title" text-anchor="middle" style="font-size:15px">Bedrock endpoints</text>
<path d="M198 99 V122" fill="none" stroke="#a0aa99" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="72" y="122" width="252" height="56" rx="6" fill="#eef1e8" stroke="#b4bfa9" stroke-width="1.2"/>
<text x="198.0" y="155.0" class="title" text-anchor="middle">Go topology CLI</text>
<path d="M198 178 V203" fill="none" stroke="#a0aa99" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="198" y="226" class="detail" text-anchor="middle" style="font-size:13px">Endpoint → AWS services</text>
<path d="M54 220 H24" fill="none" stroke="#a0aa99" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="24" cy="220" r="3" fill="#a0aa99"/>
<rect x="54" y="286" width="288" height="220" rx="6" fill="#fafaf5" stroke="#d6d9ce" stroke-width="1.2"/>
<text x="72" y="312" class="label" text-anchor="start" style="font-size:10px">HEALTH MONITORING</text>
<text x="198" y="348" class="title" text-anchor="middle" style="font-size:15px">Infrastructure signals</text>
<path d="M198 361 V384" fill="none" stroke="#a0aa99" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="72" y="384" width="252" height="56" rx="6" fill="#eef1e8" stroke="#b4bfa9" stroke-width="1.2"/>
<text x="198.0" y="417.0" class="title" text-anchor="middle">Monitoring framework</text>
<path d="M198 440 V465" fill="none" stroke="#a0aa99" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="198" y="488" class="detail" text-anchor="middle" style="font-size:13px">Live service health</text>
<path d="M54 482 H24" fill="none" stroke="#a0aa99" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="24" cy="482" r="3" fill="#a0aa99"/>
<path d="M24 220 V592 H54" fill="none" stroke="#a0aa99" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="54" y="554" width="288" height="78" rx="6" fill="#293327" stroke="#293327" stroke-width="1.2"/>
<text x="198.0" y="590.0" class="title white" text-anchor="middle">On-call diagnosis</text>
<text x="198.0" y="612.0" class="detail light" text-anchor="middle">Topology + current health</text>
</svg>
