<svg xmlns="http://www.w3.org/2000/svg" width="800" height="310" viewBox="0 0 800 310" role="img" aria-labelledby="title desc">
<title id="title">Database normalization for the GCP migration</title>
<desc id="desc">Database normalization into third normal form reduced duplicate data by 45 percent and accelerated the Google Cloud Platform migration timeline by three weeks.</desc>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; fill: #293327; }
.label { font-size: 11px; font-weight: 600; letter-spacing: 1.3px; fill: #687062; }
.title { font-size: 16px; font-weight: 600; }
.detail { font-size: 12px; fill: #687062; }
.mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; font-size: 12px; }
.accent { fill: #53634f; }
.white { fill: #fafaf5; }
.light { fill: #cbddd5; }
</style>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M1 1 L6 3.5 L1 6" fill="none" stroke="#a0aa99" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="green-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M1 1 L6 3.5 L1 6" fill="none" stroke="#53634f" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="800" height="310" fill="#fafaf5"/>
<rect x="30" y="70" width="164" height="100" rx="6" fill="#fafaf5" stroke="#d6d9ce" stroke-width="1.2"/>
<text x="112.0" y="117.0" class="title" text-anchor="middle">Source database</text>
<text x="112.0" y="139.0" class="detail" text-anchor="middle">Relational data</text>
<path d="M194 120 H222" fill="none" stroke="#a0aa99" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="222" y="70" width="164" height="100" rx="6" fill="#eef1e8" stroke="#b4bfa9" stroke-width="1.2"/>
<text x="304.0" y="117.0" class="title" text-anchor="middle">Normalize to 3NF</text>
<text x="304.0" y="139.0" class="detail" text-anchor="middle">Restructure the schema</text>
<path d="M386 120 H414" fill="none" stroke="#a0aa99" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="414" y="70" width="164" height="100" rx="6" fill="#fafaf5" stroke="#d6d9ce" stroke-width="1.2"/>
<text x="496.0" y="117.0" class="title" text-anchor="middle">Normalized data</text>
<text x="496.0" y="139.0" class="detail" text-anchor="middle">45% fewer duplicates</text>
<path d="M578 120 H606" fill="none" stroke="#a0aa99" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="606" y="70" width="164" height="100" rx="6" fill="#fafaf5" stroke="#d6d9ce" stroke-width="1.2"/>
<text x="688.0" y="117.0" class="title" text-anchor="middle">GCP migration</text>
<text x="688.0" y="139.0" class="detail" text-anchor="middle">3 weeks earlier</text>
<text x="32" y="32" class="label" text-anchor="start">DATA PREPARATION → CLOUD MIGRATION</text>
<rect x="32" y="222" width="736" height="60" rx="6" fill="#f5f5ef" stroke="#d6d9ce" stroke-width="1.2"/>
<text x="400" y="258" class="detail" text-anchor="middle" style="font-size:14px">Less duplicate data. A shorter migration timeline.</text>
</svg>
