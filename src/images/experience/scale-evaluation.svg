<svg xmlns="http://www.w3.org/2000/svg" width="800" height="448" viewBox="0 0 800 448" role="img" aria-labelledby="title desc">
<title id="title">Input preparation and response evaluation at Scale AI</title>
<desc id="desc">The input-preparation work retrieves and filters candidates, then reranks using LLM-as-a-judge and adjudication to prepare annotation inputs. A separate response benchmark scores more than 8,000 model responses daily.</desc>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; fill: #293327; }
.label { font-size: 11px; font-weight: 600; letter-spacing: 1.3px; fill: #687062; }
.title { font-size: 16px; font-weight: 600; }
.detail { font-size: 12px; fill: #687062; }
.mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; font-size: 12px; }
.accent { fill: #53634f; }
.white { fill: #fafaf5; }
.light { fill: #cbddd5; }
</style>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M1 1 L6 3.5 L1 6" fill="none" stroke="#a0aa99" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="green-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M1 1 L6 3.5 L1 6" fill="none" stroke="#53634f" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="800" height="448" fill="#fafaf5"/>
<rect x="20" y="20" width="760" height="188" rx="6" fill="#f5f5ef" stroke="#d6d9ce" stroke-width="1.2" stroke-dasharray="5 5"/>
<text x="40" y="48" class="label" text-anchor="start">INPUT PREPARATION</text>
<rect x="36" y="80" width="146" height="98" rx="6" fill="#fafaf5" stroke="#d6d9ce" stroke-width="1.2"/>
<text x="109.0" y="126.0" class="title" text-anchor="middle">Retrieval</text>
<text x="109.0" y="148.0" class="detail" text-anchor="middle">Gather candidates</text>
<path d="M182 129 H230" fill="none" stroke="#a0aa99" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="230" y="80" width="146" height="98" rx="6" fill="#fafaf5" stroke="#d6d9ce" stroke-width="1.2"/>
<text x="303.0" y="126.0" class="title" text-anchor="middle">Filtering</text>
<text x="303.0" y="148.0" class="detail" text-anchor="middle">Select candidates</text>
<path d="M376 129 H424" fill="none" stroke="#a0aa99" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="424" y="80" width="146" height="98" rx="6" fill="#eef1e8" stroke="#b4bfa9" stroke-width="1.2"/>
<text x="497.0" y="126.0" class="title" text-anchor="middle">Reranking</text>
<text x="497.0" y="148.0" class="detail" text-anchor="middle">LLM-as-a-judge</text>
<text x="497" y="168" class="detail" text-anchor="middle" style="font-size:11px">+ adjudication</text>
<path d="M570 129 H618" fill="none" stroke="#a0aa99" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="618" y="80" width="146" height="98" rx="6" fill="#fafaf5" stroke="#d6d9ce" stroke-width="1.2"/>
<text x="691.0" y="126.0" class="title" text-anchor="middle">Annotation input</text>
<text x="691.0" y="148.0" class="detail" text-anchor="middle">Prepared LLM inputs</text>
<rect x="20" y="248" width="760" height="176" rx="6" fill="#f5f5ef" stroke="#d6d9ce" stroke-width="1.2" stroke-dasharray="5 5"/>
<text x="40" y="276" class="label" text-anchor="start">RESPONSE EVALUATION</text>
<rect x="36" y="310" width="200" height="80" rx="6" fill="#fafaf5" stroke="#d6d9ce" stroke-width="1.2"/>
<text x="136.0" y="347.0" class="title" text-anchor="middle">Model responses</text>
<text x="136.0" y="369.0" class="detail" text-anchor="middle">8K+ scored daily</text>
<path d="M236 350 H300" fill="none" stroke="#a0aa99" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="300" y="310" width="200" height="80" rx="6" fill="#eef1e8" stroke="#b4bfa9" stroke-width="1.2"/>
<text x="400.0" y="347.0" class="title" text-anchor="middle">Benchmark system</text>
<text x="400.0" y="369.0" class="detail" text-anchor="middle">Evaluate responses</text>
