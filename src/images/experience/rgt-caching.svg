<svg xmlns="http://www.w3.org/2000/svg" width="800" height="680" viewBox="0 0 800 680" role="img" aria-labelledby="title desc">
<title id="title">Reducing redundant API requests with Redis</title>
<desc id="desc">A conceptual cache flow for a React application using Redis. A cache hit reuses a stored response. A cache miss fetches the API response and stores it for reuse. Reducing redundant API calls saved 1,200 dollars per month.</desc>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; fill: #293327; }
.label { font-size: 11px; font-weight: 600; letter-spacing: 1.3px; fill: #687062; }
.title { font-size: 16px; font-weight: 600; }
.detail { font-size: 12px; fill: #687062; }
.mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; font-size: 12px; }
.accent { fill: #53634f; }
.white { fill: #fafaf5; }
.light { fill: #cbddd5; }
</style>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M1 1 L6 3.5 L1 6" fill="none" stroke="#a0aa99" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="green-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M1 1 L6 3.5 L1 6" fill="none" stroke="#53634f" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="800" height="680" fill="#fafaf5"/>
<rect x="250" y="24" width="300" height="72" rx="6" fill="#fafaf5" stroke="#d6d9ce" stroke-width="1.2"/>
<text x="400.0" y="57.0" class="title" text-anchor="middle">React application</text>
<text x="400.0" y="79.0" class="detail" text-anchor="middle">Request application data</text>
<path d="M400 96 V140" fill="none" stroke="#a0aa99" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="250" y="140" width="300" height="80" rx="6" fill="#eef1e8" stroke="#b4bfa9" stroke-width="1.2"/>
<text x="400.0" y="177.0" class="title" text-anchor="middle">Redis cache lookup</text>
<text x="400.0" y="199.0" class="detail" text-anchor="middle">Check for a stored response</text>
<path d="M400 220 V254 H200 V308" fill="none" stroke="#a0aa99" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M400 254 H600 V308" fill="none" stroke="#a0aa99" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<circle cx="400" cy="254" r="3" fill="#a0aa99"/>
<text x="214" y="289" class="label accent" text-anchor="start">CACHE HIT</text>
<text x="614" y="289" class="label" text-anchor="start">CACHE MISS</text>
<rect x="68" y="308" width="264" height="76" rx="6" fill="#eef1e8" stroke="#b4bfa9" stroke-width="1.2"/>
<text x="200.0" y="343.0" class="title" text-anchor="middle">Cached response</text>
<text x="200.0" y="365.0" class="detail" text-anchor="middle">Reuse the stored result</text>
<rect x="468" y="308" width="264" height="76" rx="6" fill="#fafaf5" stroke="#d6d9ce" stroke-width="1.2"/>
<text x="600.0" y="343.0" class="title" text-anchor="middle">API request</text>
<text x="600.0" y="365.0" class="detail" text-anchor="middle">Fetch the response</text>
<path d="M600 384 V428" fill="none" stroke="#a0aa99" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="468" y="428" width="264" height="76" rx="6" fill="#fafaf5" stroke="#d6d9ce" stroke-width="1.2"/>
<text x="600.0" y="463.0" class="title" text-anchor="middle">Store in Redis</text>
<text x="600.0" y="485.0" class="detail" text-anchor="middle">Save the result for reuse</text>
<path d="M200 384 V548 H400" fill="none" stroke="#a0aa99" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M600 504 V548 H400" fill="none" stroke="#a0aa99" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="400" cy="548" r="3" fill="#a0aa99"/>
<path d="M400 548 V584" fill="none" stroke="#a0aa99" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="250" y="584" width="300" height="72" rx="6" fill="#293327" stroke="#293327" stroke-width="1.2"/>
<text x="400.0" y="617.0" class="title white" text-anchor="middle">Return to application</text>
<text x="400.0" y="639.0" class="detail light" text-anchor="middle">Serve the requested data</text>
</svg>
