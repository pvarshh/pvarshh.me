<svg xmlns="http://www.w3.org/2000/svg" width="360" height="762" viewBox="0 0 360 762" role="img" aria-labelledby="title desc">
<title id="title">Structural context and dataset expansion for code generation</title>
<desc id="desc">An AST-aware transformer uses constrained attention for code generation. A contrastive-learning pipeline expands the training dataset. The résumé reports 92% code-generation accuracy and a 250% increase in training samples.</desc>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; fill: #293327; }
.label { font-size: 11px; font-weight: 600; letter-spacing: 1.3px; fill: #687062; }
.title { font-size: 16px; font-weight: 600; }
.detail { font-size: 12px; fill: #687062; }
.mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; font-size: 12px; }
.accent { fill: #53634f; }
.white { fill: #fafaf5; }
.light { fill: #cbddd5; }
</style>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M1 1 L6 3.5 L1 6" fill="none" stroke="#a0aa99" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="green-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M1 1 L6 3.5 L1 6" fill="none" stroke="#53634f" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="360" height="762" fill="#fafaf5"/>
<rect x="54" y="24" width="252" height="78" rx="6" fill="#fafaf5" stroke="#d6d9ce" stroke-width="1.2"/>
<text x="180.0" y="60.0" class="title" text-anchor="middle">AST context</text>
<text x="180.0" y="82.0" class="detail" text-anchor="middle">Code structure</text>
<path d="M180 102 V148" fill="none" stroke="#a0aa99" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="54" y="148" width="252" height="78" rx="6" fill="#eef1e8" stroke="#b4bfa9" stroke-width="1.2"/>
<text x="180.0" y="184.0" class="title" text-anchor="middle">Transformer</text>
<text x="180.0" y="206.0" class="detail" text-anchor="middle">Constrained attention</text>
<path d="M180 226 V272" fill="none" stroke="#a0aa99" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="54" y="272" width="252" height="78" rx="6" fill="#fafaf5" stroke="#d6d9ce" stroke-width="1.2"/>
<text x="180.0" y="308.0" class="title" text-anchor="middle">Generated code</text>
<text x="180.0" y="330.0" class="detail" text-anchor="middle">92% reported accuracy</text>
<rect x="20" y="396" width="320" height="340" rx="6" fill="#f5f5ef" stroke="#bacfc1" stroke-width="1.2" stroke-dasharray="5 5"/>
<text x="40" y="426" class="label accent" text-anchor="start">DATASET EXPANSION</text>
<rect x="54" y="454" width="252" height="70" rx="6" fill="#fafaf5" stroke="#d6d9ce" stroke-width="1.2"/>
<text x="180.0" y="486.0" class="title" text-anchor="middle">Training corpus</text>
<text x="180.0" y="508.0" class="detail" text-anchor="middle">Existing samples</text>
<path d="M180 524 V548" fill="none" stroke="#a0aa99" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="54" y="548" width="252" height="70" rx="6" fill="#eef1e8" stroke="#b4bfa9" stroke-width="1.2"/>
<text x="180.0" y="580.0" class="title" text-anchor="middle">Contrastive learning</text>
<text x="180.0" y="602.0" class="detail" text-anchor="middle">Dataset expansion</text>
<path d="M180 618 V642" fill="none" stroke="#a0aa99" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="54" y="642" width="252" height="70" rx="6" fill="#fafaf5" stroke="#d6d9ce" stroke-width="1.2"/>
<text x="180.0" y="674.0" class="title" text-anchor="middle">Expanded corpus</text>
<text x="180.0" y="696.0" class="detail" text-anchor="middle">250% more samples</text>
<path d="M54 677 H24 V187 H54" fill="none" stroke="#53634f" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#green-arrow)" stroke-dasharray="4 5"/>
</svg>
