<svg xmlns="http://www.w3.org/2000/svg" width="360" height="608" viewBox="0 0 360 608" role="img" aria-labelledby="title desc">
<title id="title">Reducing redundant API requests with Redis</title>
<desc id="desc">A conceptual cache flow for a React application using Redis. A cache hit reuses a stored response. A cache miss fetches the API response and stores it for reuse. Reducing redundant API calls saved 1,200 dollars per month.</desc>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; fill: #293327; }
.label { font-size: 11px; font-weight: 600; letter-spacing: 1.3px; fill: #687062; }
.title { font-size: 16px; font-weight: 600; }
.detail { font-size: 12px; fill: #687062; }
.mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; font-size: 12px; }
.accent { fill: #53634f; }
.white { fill: #fafaf5; }
.light { fill: #cbddd5; }
</style>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M1 1 L6 3.5 L1 6" fill="none" stroke="#a0aa99" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="green-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M1 1 L6 3.5 L1 6" fill="none" stroke="#53634f" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="360" height="608" fill="#fafaf5"/>
<rect x="54" y="24" width="252" height="72" rx="6" fill="#fafaf5" stroke="#d6d9ce" stroke-width="1.2"/>
<text x="180.0" y="57.0" class="title" text-anchor="middle">React application</text>
<text x="180.0" y="79.0" class="detail" text-anchor="middle">Request application data</text>
<path d="M180 96 V136" fill="none" stroke="#a0aa99" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="54" y="136" width="252" height="78" rx="6" fill="#eef1e8" stroke="#b4bfa9" stroke-width="1.2"/>
<text x="180.0" y="172.0" class="title" text-anchor="middle">Redis cache lookup</text>
<text x="180.0" y="194.0" class="detail" text-anchor="middle">Check for a stored response</text>
<path d="M180 214 V244 H94 V292" fill="none" stroke="#a0aa99" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M180 244 H266 V292" fill="none" stroke="#a0aa99" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<circle cx="180" cy="244" r="3" fill="#a0aa99"/>
<text x="108" y="274" class="label accent" text-anchor="start" style="font-size:10px">HIT</text>
<text x="280" y="274" class="label" text-anchor="start" style="font-size:10px">MISS</text>
<rect x="20" y="292" width="148" height="72" rx="6" fill="#eef1e8" stroke="#b4bfa9" stroke-width="1.2"/>
<text x="94" y="323" class="title" text-anchor="middle" style="font-size:14px">Cached response</text>
<text x="94" y="345" class="detail" text-anchor="middle" style="font-size:11px">Reuse the result</text>
<rect x="192" y="292" width="148" height="72" rx="6" fill="#fafaf5" stroke="#d6d9ce" stroke-width="1.2"/>
<text x="266" y="323" class="title" text-anchor="middle" style="font-size:14px">API request</text>
<text x="266" y="345" class="detail" text-anchor="middle" style="font-size:11px">Fetch response</text>
<rect x="192" y="400" width="148" height="72" rx="6" fill="#fafaf5" stroke="#d6d9ce" stroke-width="1.2"/>
<text x="266" y="431" class="title" text-anchor="middle" style="font-size:14px">Store in Redis</text>
<text x="266" y="453" class="detail" text-anchor="middle" style="font-size:11px">Save for reuse</text>
<path d="M266 364 V400" fill="none" stroke="#a0aa99" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M94 364 V500 H180" fill="none" stroke="#a0aa99" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M266 472 V500 H180" fill="none" stroke="#a0aa99" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="180" cy="500" r="3" fill="#a0aa99"/>
<path d="M180 500 V536" fill="none" stroke="#a0aa99" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="54" y="536" width="252" height="52" rx="6" fill="#293327" stroke="#293327" stroke-width="1.2"/>
<text x="180.0" y="567.0" class="title white" text-anchor="middle">Return to application</text>
</svg>
