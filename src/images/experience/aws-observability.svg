<svg xmlns="http://www.w3.org/2000/svg" width="800" height="606" viewBox="0 0 800 606" role="img" aria-labelledby="title desc">
<title id="title">Mapping dependencies and monitoring model-serving health</title>
<desc id="desc">Endpoint dependency mapping and infrastructure health monitoring provide complementary inputs for on-call diagnosis. The Go CLI maps Bedrock endpoints to downstream AWS services.</desc>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; fill: #293327; }
.label { font-size: 11px; font-weight: 600; letter-spacing: 1.3px; fill: #687062; }
.title { font-size: 16px; font-weight: 600; }
.detail { font-size: 12px; fill: #687062; }
.mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; font-size: 12px; }
.accent { fill: #53634f; }
.white { fill: #fafaf5; }
.light { fill: #cbddd5; }
</style>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M1 1 L6 3.5 L1 6" fill="none" stroke="#a0aa99" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="green-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M1 1 L6 3.5 L1 6" fill="none" stroke="#53634f" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="800" height="606" fill="#fafaf5"/>
<text x="210" y="30" class="label" text-anchor="middle">DEPENDENCY MAPPING</text>
<rect x="70" y="54" width="280" height="76" rx="6" fill="#fafaf5" stroke="#d6d9ce" stroke-width="1.2"/>
<text x="210.0" y="89.0" class="title" text-anchor="middle">Bedrock endpoints</text>
<text x="210.0" y="111.0" class="detail" text-anchor="middle">SageMaker serving infrastructure</text>
<path d="M210 130 V180" fill="none" stroke="#a0aa99" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="70" y="180" width="280" height="82" rx="6" fill="#eef1e8" stroke="#b4bfa9" stroke-width="1.2"/>
<text x="210.0" y="218.0" class="title" text-anchor="middle">Go topology CLI</text>
<text x="210.0" y="240.0" class="detail" text-anchor="middle">Map downstream AWS services</text>
<path d="M210 262 V312" fill="none" stroke="#a0aa99" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="70" y="312" width="280" height="76" rx="6" fill="#fafaf5" stroke="#d6d9ce" stroke-width="1.2"/>
<text x="210.0" y="347.0" class="title" text-anchor="middle">Dependency topology</text>
<text x="210.0" y="369.0" class="detail" text-anchor="middle">Endpoint-to-service relationships</text>
<path d="M210 388 V434 H400" fill="none" stroke="#a0aa99" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="590" y="30" class="label" text-anchor="middle">HEALTH MONITORING</text>
<rect x="450" y="54" width="280" height="76" rx="6" fill="#fafaf5" stroke="#d6d9ce" stroke-width="1.2"/>
<text x="590.0" y="89.0" class="title" text-anchor="middle">Infrastructure health</text>
<text x="590.0" y="111.0" class="detail" text-anchor="middle">Live system signals</text>
<path d="M590 130 V180" fill="none" stroke="#a0aa99" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="450" y="180" width="280" height="82" rx="6" fill="#eef1e8" stroke="#b4bfa9" stroke-width="1.2"/>
<text x="590.0" y="218.0" class="title" text-anchor="middle">Monitoring framework</text>
<text x="590.0" y="240.0" class="detail" text-anchor="middle">Observe system health in real time</text>
<path d="M590 262 V312" fill="none" stroke="#a0aa99" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="450" y="312" width="280" height="76" rx="6" fill="#fafaf5" stroke="#d6d9ce" stroke-width="1.2"/>
<text x="590.0" y="347.0" class="title" text-anchor="middle">Service health</text>
<text x="590.0" y="369.0" class="detail" text-anchor="middle">Visibility into infrastructure issues</text>
<path d="M590 388 V434 H400" fill="none" stroke="#a0aa99" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="400" cy="434" r="3" fill="#a0aa99"/>
<path d="M400 434 V474" fill="none" stroke="#a0aa99" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="226" y="474" width="348" height="78" rx="6" fill="#293327" stroke="#293327" stroke-width="1.2"/>
<text x="400.0" y="510.0" class="title white" text-anchor="middle">On-call diagnosis</text>
<text x="400.0" y="532.0" class="detail light" text-anchor="middle">Understand the endpoint and its dependencies</text>
<text x="400" y="585" class="detail" text-anchor="middle" style="font-size:13px">Topology explains relationships. Health signals show current conditions.</text>
</svg>
