<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="460" viewBox="0 0 1600 460" role="img" aria-labelledby="title desc">
<title id="title">Licensing optimization agent architecture</title>
<desc id="desc">The data pipeline feeds an umbrella agent. A Vertex powered Dashboard communicates with the umbrella agent. The umbrella agent connects to a subprocesses system containing an understanding subagent, a state checker, a recommendation subagent, and an application subagent. The subagents exchange information in both directions.</desc>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; font-size: 23px; font-weight: 600; fill: #293327; text-anchor: middle; }
.node { fill: #fafaf5; stroke: #d6d9ce; stroke-width: 2.4; }
.system { fill: #f5f5ef; stroke-dasharray: 10 10; }
.coordinator { fill: #293327; stroke: #293327; }
.coordinator-title { fill: #fafaf5; }
.state { fill: #eef1e8; stroke: #b4bfa9; }
.system-label { fill: #687062; font-size: 18px; letter-spacing: 1.2px; }
.system-heading { fill: #f5f5ef; stroke: none; }
.edge { fill: none; stroke: #a0aa99; stroke-width: 2.8; stroke-linecap: round; stroke-linejoin: round; }
</style>
<defs>
<marker id="arrow" markerWidth="13" markerHeight="12" refX="11" refY="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 11 6 1 11" fill="none" stroke="#a0aa99" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
