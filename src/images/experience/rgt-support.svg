<svg xmlns="http://www.w3.org/2000/svg" width="800" height="382" viewBox="0 0 800 382" role="img" aria-labelledby="title desc">
<title id="title">Customer support grounded in company data</title>
<desc id="desc">Customer inquiries and company data support retrieval-augmented generation. Relevant company context is retrieved for a generated support response. The system resolved 80 percent of inquiries with 90 percent accuracy.</desc>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; fill: #293327; }
.label { font-size: 11px; font-weight: 600; letter-spacing: 1.3px; fill: #687062; }
.title { font-size: 16px; font-weight: 600; }
.detail { font-size: 12px; fill: #687062; }
.mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; font-size: 12px; }
.accent { fill: #53634f; }
.white { fill: #fafaf5; }
.light { fill: #cbddd5; }
</style>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M1 1 L6 3.5 L1 6" fill="none" stroke="#a0aa99" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="green-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M1 1 L6 3.5 L1 6" fill="none" stroke="#53634f" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="800" height="382" fill="#fafaf5"/>
<rect x="228" y="24" width="148" height="78" rx="6" fill="#fafaf5" stroke="#d6d9ce" stroke-width="1.2"/>
<text x="302.0" y="60.0" class="title" text-anchor="middle">Company data</text>
<text x="302.0" y="82.0" class="detail" text-anchor="middle">Knowledge source</text>
