<rect x="228" y="184" width="148" height="96" rx="6" fill="#eef1e8" stroke="#b4bfa9" stroke-width="1.2"/>
<text x="302.0" y="229.0" class="title" text-anchor="middle">Retrieval</text>
<text x="302.0" y="251.0" class="detail" text-anchor="middle">Company context</text>
<path d="M376 232 H424" fill="none" stroke="#a0aa99" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="424" y="184" width="148" height="96" rx="6" fill="#eef1e8" stroke="#b4bfa9" stroke-width="1.2"/>
<text x="498.0" y="229.0" class="title" text-anchor="middle">Generation</text>
<text x="498.0" y="251.0" class="detail" text-anchor="middle">Context-grounded RAG</text>
<path d="M572 232 H620" fill="none" stroke="#a0aa99" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="620" y="184" width="148" height="96" rx="6" fill="#fafaf5" stroke="#d6d9ce" stroke-width="1.2"/>
<text x="694.0" y="229.0" class="title" text-anchor="middle">Support response</text>
<text x="694.0" y="251.0" class="detail" text-anchor="middle">Answer the inquiry</text>
