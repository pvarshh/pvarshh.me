<text x="316" y="148" class="label" text-anchor="start" style="font-size:10px">CONTEXT</text>
<rect x="32" y="184" width="148" height="96" rx="6" fill="#fafaf5" stroke="#d6d9ce" stroke-width="1.2"/>
<text x="106.0" y="229.0" class="title" text-anchor="middle">Customer inquiry</text>
<text x="106.0" y="251.0" class="detail" text-anchor="middle">Support question</text>
