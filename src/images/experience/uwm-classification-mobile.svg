<svg xmlns="http://www.w3.org/2000/svg" width="360" height="506" viewBox="0 0 360 506" role="img" aria-labelledby="title desc">
<title id="title">Classifying loan outcomes with a random forest</title>
<desc id="desc">A random forest model classifies loan proposals into acceptance or rejection outcomes. This project saved 20,000 dollars.</desc>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; fill: #293327; }
.label { font-size: 11px; font-weight: 600; letter-spacing: 1.3px; fill: #687062; }
.title { font-size: 16px; font-weight: 600; }
.detail { font-size: 12px; fill: #687062; }
.mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; font-size: 12px; }
.accent { fill: #53634f; }
.white { fill: #fafaf5; }
.light { fill: #cbddd5; }
</style>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M1 1 L6 3.5 L1 6" fill="none" stroke="#a0aa99" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="green-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M1 1 L6 3.5 L1 6" fill="none" stroke="#53634f" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="360" height="506" fill="#fafaf5"/>
<rect x="54" y="24" width="252" height="78" rx="6" fill="#fafaf5" stroke="#d6d9ce" stroke-width="1.2"/>
<text x="180.0" y="60.0" class="title" text-anchor="middle">Loan proposal</text>
<text x="180.0" y="82.0" class="detail" text-anchor="middle">Input data</text>
<path d="M180 102 V146" fill="none" stroke="#a0aa99" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="54" y="146" width="252" height="84" rx="6" fill="#eef1e8" stroke="#b4bfa9" stroke-width="1.2"/>
<text x="180.0" y="185.0" class="title" text-anchor="middle">Random forest</text>
<text x="180.0" y="207.0" class="detail" text-anchor="middle">Outcome classifier</text>
<path d="M180 230 V270 H94 V326" fill="none" stroke="#a0aa99" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M180 270 H266 V326" fill="none" stroke="#a0aa99" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<circle cx="180" cy="270" r="3" fill="#a0aa99"/>
<text x="180" y="303" class="label" text-anchor="middle" style="font-size:10px">PREDICTED OUTCOME</text>
<rect x="20" y="326" width="148" height="68" rx="6" fill="#fafaf5" stroke="#d6d9ce" stroke-width="1.2"/>
<text x="94.0" y="365.0" class="title" text-anchor="middle">Accept</text>
<rect x="192" y="326" width="148" height="68" rx="6" fill="#fafaf5" stroke="#d6d9ce" stroke-width="1.2"/>
<text x="266.0" y="365.0" class="title" text-anchor="middle">Reject</text>
<text x="180" y="455" class="title accent" text-anchor="middle">$20K saved</text>
<text x="180" y="480" class="detail" text-anchor="middle">Outcome of the classification project</text>
</svg>
