<svg xmlns="http://www.w3.org/2000/svg" width="800" height="570" viewBox="0 0 800 570" role="img" aria-labelledby="title desc">
<title id="title">Preserving BYOC lineage before the minimum guardrail</title>
<desc id="desc">VDF, restaurant configuration, or a constant supplies a raw ETD. The provider snapshots the value and source. The serving branch applies the minimum guardrail; the logging branch preserves the original value in ByocInfo for Kafka.</desc>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; fill: #293327; }
.label { font-size: 11px; font-weight: 600; letter-spacing: 1.3px; fill: #687062; }
.title { font-size: 16px; font-weight: 600; }
.detail { font-size: 12px; fill: #687062; }
.mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; font-size: 12px; }
.accent { fill: #53634f; }
.white { fill: #fafaf5; }
.light { fill: #cbddd5; }
</style>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M1 1 L6 3.5 L1 6" fill="none" stroke="#a0aa99" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="green-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M1 1 L6 3.5 L1 6" fill="none" stroke="#53634f" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="800" height="570" fill="#fafaf5"/>
<rect x="32" y="28" width="208" height="74" rx="6" fill="#fafaf5" stroke="#d6d9ce" stroke-width="1.2"/>
<text x="136.0" y="62.0" class="title" text-anchor="middle">VDF</text>
<text x="136.0" y="84.0" class="detail" text-anchor="middle">Live courier feed</text>
<path d="M136 102 V136 H400" fill="none" stroke="#a0aa99" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="296" y="28" width="208" height="74" rx="6" fill="#fafaf5" stroke="#d6d9ce" stroke-width="1.2"/>
<text x="400.0" y="62.0" class="title" text-anchor="middle">Restaurant config</text>
<text x="400.0" y="84.0" class="detail" text-anchor="middle">Merchant-level setting</text>
<path d="M400 102 V136 H400" fill="none" stroke="#a0aa99" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="560" y="28" width="208" height="74" rx="6" fill="#fafaf5" stroke="#d6d9ce" stroke-width="1.2"/>
<text x="664.0" y="62.0" class="title" text-anchor="middle">Constant</text>
<text x="664.0" y="84.0" class="detail" text-anchor="middle">Fallback value</text>
<path d="M664 102 V136 H400" fill="none" stroke="#a0aa99" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="400" cy="136" r="3" fill="#a0aa99"/>
<path d="M400 136 V174" fill="none" stroke="#a0aa99" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="230" y="174" width="340" height="82" rx="6" fill="#f7f9f7" stroke="#b9c9c0" stroke-width="1.2"/>
<text x="400" y="204" class="title" text-anchor="middle">Snapshot provider output</text>
<text x="400" y="231" class="mono" text-anchor="middle">raw ETD  +  source</text>
<path d="M400 256 V282 H202 V336" fill="none" stroke="#a0aa99" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M400 282 H598 V336" fill="none" stroke="#53634f" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#green-arrow)"/>
<circle cx="400" cy="282" r="3" fill="#53634f"/>
<text x="62" y="320" class="label" text-anchor="start">SERVING VALUE</text>
<text x="458" y="320" class="label accent" text-anchor="start">OBSERVABILITY</text>
<rect x="62" y="336" width="280" height="78" rx="6" fill="#fafaf5" stroke="#d6d9ce" stroke-width="1.2"/>
<text x="202.0" y="372.0" class="title" text-anchor="middle">Minimum ETD guardrail</text>
<text x="202.0" y="394.0" class="detail" text-anchor="middle">max(raw ETD, minimum)</text>
<rect x="458" y="336" width="280" height="78" rx="6" fill="#eef1e8" stroke="#b4bfa9" stroke-width="1.2"/>
<text x="598.0" y="372.0" class="title" text-anchor="middle">ByocInfo</text>
<text x="598.0" y="394.0" class="detail" text-anchor="middle">Original ETD + provider source</text>
<path d="M202 414 V462" fill="none" stroke="#a0aa99" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M598 414 V462" fill="none" stroke="#53634f" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#green-arrow)"/>
<rect x="62" y="462" width="280" height="68" rx="6" fill="#293327" stroke="#293327" stroke-width="1.2"/>
<text x="202.0" y="493.0" class="title white" text-anchor="middle">Customer estimate</text>
<text x="202.0" y="515.0" class="detail light" text-anchor="middle">Guarded delivery promise</text>
<rect x="458" y="462" width="280" height="68" rx="6" fill="#eef1e8" stroke="#b4bfa9" stroke-width="1.2"/>
<text x="598.0" y="493.0" class="title" text-anchor="middle">Kafka event</text>
<text x="598.0" y="515.0" class="detail" text-anchor="middle">Original signal remains inspectable</text>
</svg>
