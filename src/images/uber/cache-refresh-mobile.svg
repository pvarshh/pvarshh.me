<svg xmlns="http://www.w3.org/2000/svg" width="360" height="764" viewBox="0 0 360 764" role="img" aria-labelledby="title desc">
<title id="title">Observing asynchronous cache refreshes</title>
<desc id="desc">A fresh cache hit returns the cached value without a refresh event. A miss or stale value enters asynchronous refresh: run the ML prediction, adapt one event per restaurant, then publish it to the cache-refresh topic. Refresh logging is in progress.</desc>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; fill: #293327; }
.label { font-size: 11px; font-weight: 600; letter-spacing: 1.3px; fill: #687062; }
.title { font-size: 16px; font-weight: 600; }
.detail { font-size: 12px; fill: #687062; }
.mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; font-size: 12px; }
.accent { fill: #53634f; }
.white { fill: #fafaf5; }
.light { fill: #cbddd5; }
</style>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M1 1 L6 3.5 L1 6" fill="none" stroke="#a0aa99" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="green-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M1 1 L6 3.5 L1 6" fill="none" stroke="#53634f" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="360" height="764" fill="#fafaf5"/>
<rect x="72" y="20" width="216" height="68" rx="6" fill="#fafaf5" stroke="#d6d9ce" stroke-width="1.2"/>
<text x="180.0" y="51.0" class="title" text-anchor="middle">Cache lookup</text>
<text x="180.0" y="73.0" class="detail" text-anchor="middle">Read cached ETD</text>
<path d="M180 88 V118" fill="none" stroke="#a0aa99" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M180 118 L238 174 L180 230 L122 174 Z" fill="#f7f9f7" stroke="#b9c9c0" stroke-width="1.2"/>
<text x="180" y="171" class="title" text-anchor="middle" style="font-size:15px">Fresh</text>
<text x="180" y="191" class="title" text-anchor="middle" style="font-size:15px">value?</text>
<path d="M238 174 H326 V224 H247 V244" fill="none" stroke="#a0aa99" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="289" y="159" class="label" text-anchor="middle">YES</text>
<rect x="170" y="244" width="154" height="62" rx="6" fill="#fafaf5" stroke="#d6d9ce" stroke-width="1.2"/>
<text x="247" y="268" class="title" text-anchor="middle" style="font-size:14px">Cached value</text>
<text x="247" y="290" class="detail" text-anchor="middle" style="font-size:11px">No refresh event</text>
<text x="64" y="290" class="label accent" text-anchor="start">MISS /</text>
<text x="64" y="309" class="label accent" text-anchor="start">STALE</text>
<rect x="20" y="332" width="320" height="408" rx="6" fill="#f7faf8" stroke="#bacfc1" stroke-width="1.2" stroke-dasharray="5 5"/>
<path d="M180 230 V236 H24 V400 H180 V412" fill="none" stroke="#53634f" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#green-arrow)"/>
<text x="36" y="361" class="label accent" text-anchor="start">ASYNC REFRESH</text>
<text x="36" y="382" class="detail" text-anchor="start">Logging in progress</text>
<rect x="54" y="412" width="252" height="74" rx="6" fill="#fafaf5" stroke="#d6d9ce" stroke-width="1.2"/>
<text x="180.0" y="446.0" class="title" text-anchor="middle">ML prediction</text>
<text x="180.0" y="468.0" class="detail" text-anchor="middle">Warm cache · model + features</text>
<path d="M180 486 V522" fill="none" stroke="#a0aa99" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="54" y="522" width="252" height="74" rx="6" fill="#eef1e8" stroke="#b4bfa9" stroke-width="1.2"/>
<text x="180.0" y="556.0" class="title" text-anchor="middle">Event adapter</text>
<text x="180.0" y="578.0" class="detail" text-anchor="middle">One request / response per store</text>
<path d="M180 596 V632" fill="none" stroke="#a0aa99" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="54" y="632" width="252" height="74" rx="6" fill="#fafaf5" stroke="#d6d9ce" stroke-width="1.2"/>
<text x="180.0" y="666.0" class="title" text-anchor="middle">Kafka publisher</text>
<text x="180.0" y="688.0" class="detail" text-anchor="middle">Cache-refresh topic</text>
</svg>
